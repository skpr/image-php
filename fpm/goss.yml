command:
  check-configuration:
    exec: "mkdir -p /data/app && php-fpm --test"
    exit-status: 0
    stdout:
      not:
        contain-substring: "WARNING"

  check-fpm-log-limit:
    exec: "mkdir -p /data/app && php-fpm -tt 2>&1"
    exit-status: 0
    stdout:
      contain-substring: "log_limit = 32768"

  check-php-compass-extension:
    exec: "php -m | grep -i compass"
    exit-status: 0
    stdout:
      contain-substring: "compass"

  check-php-compass-config-file:
    exec: "php -i | grep compass.config_file"
    exit-status: 0
    stdout:
      contain-substring: "/etc/compass/config.yml"

file:
  /etc/compass/config.yml:
    exists: true
    owner: skpr
    group: skpr
    contents:
      - "function_threshold"
      - "suspend"
